<body>
<header>
  <h1>audio-feedback sounds</h1>
  <button id="playall">play all</button>
  <span class="status"><span class="dot" id="dot"></span><span id="stat">connecting…</span></span>
</header>
<div id="banner"></div>
<div id="root"></div>
<div id="transport">
  <button id="prev" title="previous">⏮</button>
  <button id="next" title="next">⏭</button>
  <span class="np" id="nowplaying">—</span>
  <audio id="mainplayer" controls preload="none"></audio>
</div>
<script>
const ctx = new (window.AudioContext || window.webkitAudioContext)();
let version = 0;

const GROUPS = [
  ["base", n => !n.includes("-") || ["user-prompt-submit","pre-tool-use","post-tool-use","pre-compact","subagent-stop","session-start"].includes(n)],
  ["pre-tool-use", n => n.startsWith("pre-tool-use-")],
  ["post-tool-use", n => n.startsWith("post-tool-use-")],
  ["notification", n => n.startsWith("notification-")],
  ["session-start", n => n.startsWith("session-start-")],
];
const BASE = ["session-start","user-prompt-submit","pre-tool-use","notification","pre-compact","post-tool-use","subagent-stop","stop"];

const cards = {};        // name -> {el, canvas, audio, params}
let orderedNames = [];   // playback order across groups
let curIdx = -1;
let playingAll = false;  // transport auto-advances only during "play all"
const main = () => document.getElementById("mainplayer");

function drawWave(canvas, audiobuf) {
  const w = canvas.width = canvas.clientWidth * devicePixelRatio;
  const h = canvas.height = canvas.clientHeight * devicePixelRatio;
  const g = canvas.getContext("2d");
  const data = audiobuf.getChannelData(0);
  const step = Math.max(1, Math.floor(data.length / w));
  g.clearRect(0, 0, w, h);
  g.strokeStyle = getComputedStyle(document.body).getPropertyValue("--color-info");
  g.beginPath();
  for (let x = 0; x < w; x++) {
    let min = 1, max = -1;
    for (let i = 0; i < step; i++) { const v = data[x*step+i] || 0; if (v<min) min=v; if (v>max) max=v; }
    g.moveTo(x, (1-min)*h/2); g.lineTo(x, (1-max)*h/2);
  }
  g.stroke();
}

async function drawWaveInto(canvas, name) {
  try {
    const res = await fetch(`/sounds/${name}.wav?v=${version}`);
    drawWave(canvas, await ctx.decodeAudioData(await res.arrayBuffer()));
  } catch (e) { /* transient 404 during a save race -- keep the prior waveform */ }
}

function paramText(p) {
  if (p.voice === "swoosh") return `swoosh ${p.swoosh_dir === "up" ? "↑ send" : "↓ receive"}`;
  const acc = Object.entries(p.accents || {}).map(([k,v]) => `${k}=${v}`).join(" ");
  const lvl = p.level_db ? ` ${p.level_db}dB` : "";
  return `${p.notes.join(" ")}${acc ? " · "+acc : ""}${lvl}`;
}

function highlight(name) {
  Object.values(cards).forEach(c => c.el.classList.remove("playing"));
  if (cards[name]) cards[name].el.classList.add("playing");
}

function loadInto(name, autoplay = true) {
  curIdx = orderedNames.indexOf(name);
  main().src = `/sounds/${name}.wav?v=${version}`;
  document.getElementById("nowplaying").textContent = name;
  highlight(name);
  if (autoplay) main().play().catch(() => {});
}

function step(d) {
  if (!orderedNames.length) return;
  const i = (curIdx + d + orderedNames.length) % orderedNames.length;
  loadInto(orderedNames[i]);
}

function orderedItems(palette) {
  const order = {}; BASE.forEach((n,i) => order[n] = i);
  const groups = [];
  for (const [title, test] of GROUPS) {
    const items = palette.filter(p => test(p.name));
    if (title === "base") items.sort((a,b) => (order[a.name]??99)-(order[b.name]??99));
    if (items.length) groups.push([title, items]);
  }
  return groups;
}

function makeCard(p) {
  const el = document.createElement("div"); el.className = "card";
  el.innerHTML = `<div class="name">${p.name} <span class="badge ${p.voice}">${p.voice}</span></div>
    <canvas></canvas><div class="params"></div><audio controls preload="none"></audio>`;
  const canvas = el.querySelector("canvas"), audio = el.querySelector("audio"), params = el.querySelector(".params");
  params.textContent = paramText(p);
  audio.src = `/sounds/${p.name}.wav?v=${version}`;
  el.addEventListener("click", e => { if (e.target.tagName !== "AUDIO") { playingAll = false; loadInto(p.name); } });
  cards[p.name] = { el, canvas, audio, params };
  drawWaveInto(canvas, p.name);
  return el;
}

function rebuild(groups) {
  const root = document.getElementById("root"); root.innerHTML = "";
  for (const k in cards) delete cards[k];
  for (const [title, list] of groups) {
    const h = document.createElement("div"); h.className = "group-title"; h.textContent = title;
    const grid = document.createElement("div"); grid.className = "grid";
    list.forEach(p => grid.append(makeCard(p)));
    root.append(h, grid);
  }
}

// Update existing cards in place (no DOM teardown -> no reload flicker).
function updateInPlace(palette) {
  for (const p of palette) {
    const c = cards[p.name];
    c.params.textContent = paramText(p);
    // only reload a card's <audio> src if it isn't mid-playback (avoid interrupting)
    if (c.audio.paused) c.audio.src = `/sounds/${p.name}.wav?v=${version}`;
    drawWaveInto(c.canvas, p.name);
  }
}

async function refresh() {
  const palette = await (await fetch("/api/palette")).json();
  const groups = orderedItems(palette);
  orderedNames = groups.flatMap(([, list]) => list.map(p => p.name));
  const sameSet = Object.keys(cards).length === palette.length && palette.every(p => cards[p.name]);
  if (sameSet) updateInPlace(palette); else rebuild(groups);
}

document.getElementById("prev").onclick = () => { playingAll = false; step(-1); };
document.getElementById("next").onclick = () => { playingAll = false; step(1); };
main().addEventListener("ended", () => {
  if (playingAll && curIdx < orderedNames.length - 1) step(1);
  else { playingAll = false; highlight(null); }
});
document.getElementById("playall").onclick = () => { playingAll = true; if (orderedNames.length) loadInto(orderedNames[0]); };

const es = new EventSource("/events");
es.onopen = () => { document.getElementById("dot").classList.remove("off"); document.getElementById("stat").textContent = "live"; };
es.onerror = () => { document.getElementById("dot").classList.add("off"); document.getElementById("stat").textContent = "disconnected"; };
es.addEventListener("reload", e => {
  version = e.data; document.getElementById("banner").style.display = "none";
  refresh();
});
es.addEventListener("error", e => {
  const b = document.getElementById("banner"); b.style.display = "block"; b.textContent = e.data;
});
refresh();
</script>
